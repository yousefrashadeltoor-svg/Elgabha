name: Import original Frontline 1943 and validate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify the uploaded game archive
        shell: bash
        run: |
          set -euo pipefail
          test -f frontline-1943-g1.zip
          echo "89974e3313a0736da3d532e66975983028920d1ddc4ac9b1d215f59534c2e122  frontline-1943-g1.zip" | sha256sum --check

      - name: Extract an untouched source copy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/frontline-source
          unzip -q frontline-1943-g1.zip -d /tmp/frontline-source
          test -f /tmp/frontline-source/package.json
          test -f /tmp/frontline-source/index.html
          cp -a /tmp/frontline-source /tmp/frontline-check

      - name: Install locked dependencies and run tests/build
        shell: bash
        working-directory: /tmp/frontline-check
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: Add the exact original source to the repository
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/frontline-source/. .
          rm -f frontline-1943-g1.zip
          rm -rf /tmp/frontline-source /tmp/frontline-check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import original Frontline 1943 game"
        env:
          GIT_CONFIG_NOSYSTEM: "1"

      - name: Push validated game files to main
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:main
